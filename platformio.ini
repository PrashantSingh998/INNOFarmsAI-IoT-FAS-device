; https://docs.platformio.org/page/projectconf.html

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino

; build_flags =
;     -D USER_SETUP_LOADED=1
;     -D ILI9488_DRIVER=1
;     -D TFT_WIDTH=320
;     -D TFT_HEIGHT=480
;     -D TFT_MISO=-1
;     -D TFT_MOSI=13
;     -D TFT_SCLK=14
;     -D TFT_CS=15
;     -D TFT_DC=4
;     -D TFT_RST=5
;     -D LOAD_GLCD=1
;     -D LOAD_FONT2=1
;     -D LOAD_FONT4=1
;     -D LOAD_FONT6=1
;     -D LOAD_FONT7=1
;     -D LOAD_FONT8=1
    ; -D SPI_FREQUENCY=10000000



build_flags =
    -D USER_SETUP_LOADED
    -D ILI9488_DRIVER

    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480

    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14

    -D TFT_CS=15
    -D TFT_DC=4
    -D TFT_RST=-1

    -D TOUCH_CS=5

    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4

    -D SPI_FREQUENCY=10000000
    -D SPI_READ_FREQUENCY=10000000
    -D SPI_TOUCH_FREQUENCY=2500000


lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson @ ^6.21.5
    knolleary/PubSubClient @ ^2.8.0
